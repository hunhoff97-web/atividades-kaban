<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kanban — teste de leitura</title><style>body{font:15px system-ui,Arial;background:#f2f3ef;color:#072f38;margin:0;padding:24px}.wrap{max-width:760px;margin:auto;background:#fff;padding:24px;border:1px solid #d4d9d1;border-radius:14px}input{width:100%;padding:11px;box-sizing:border-box;margin:8px 0 12px;border:1px solid #aaa;border-radius:7px}button{padding:11px 15px;background:#334e3b;color:white;border:0;border-radius:8px;cursor:pointer;margin-right:6px}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f3ef;padding:12px;border-radius:8px}small{color:#52645a}</style><script src="https://accounts.google.com/gsi/client" async defer></script></head><body><main class="wrap"><h2>Atividades Kanban — teste de leitura</h2><p>Teste independente, somente leitura. Não altera nenhuma planilha.</p><label for="sheet">Link ou ID da <strong>planilha de testes</strong></label><input id="sheet" placeholder="Cole o link da cópia no Google Sheets" autocomplete="off"><button id="login">Autorizar leitura com Google</button><button id="read" disabled>Ler estrutura e contagens</button><button id="logout" disabled>Encerrar teste</button><p><small>O identificador da planilha e o token não são gravados no navegador. Não use este teste para a planilha principal.</small></p><pre id="out" role="status">Aguardando autorização.</pre></main><script>
'use strict';
const CLIENT_ID='525741473575-p02i1dsgtsatv07k7lqi6c811upigruh.apps.googleusercontent.com';
const SCOPES='https://www.googleapis.com/auth/spreadsheets.readonly';
let token='',tokenClient=null,expires=0;
const $=id=>document.getElementById(id),log=t=>$('out').textContent=t;
function sheetId(){const v=$('sheet').value.trim();const m=v.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);const id=m?m[1]:v;if(!/^[a-zA-Z0-9_-]{20,}$/.test(id))throw Error('Cole um link válido do Google Sheets ou o ID da planilha.');return id;}
function ensureClient(){if(!window.google?.accounts?.oauth2)throw Error('Biblioteca de login ainda não carregou. Aguarde e tente novamente.');if(!tokenClient)tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:r=>{if(r.error){log('Falha na autorização: '+r.error);return;}token=r.access_token;expires=Date.now()+(Number(r.expires_in||3600)-60)*1000;$('read').disabled=false;$('logout').disabled=false;log('Autorização de leitura recebida. Clique em “Ler estrutura e contagens”.');}});}
$('login').onclick=()=>{try{sheetId();ensureClient();tokenClient.requestAccessToken({prompt:token?'':'consent'});}catch(e){log('Erro: '+e.message);}};
async function api(path){const r=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+path,{headers:{Authorization:'Bearer '+token},cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error?.message||'Erro HTTP '+r.status);return j;}
$('read').onclick=async()=>{try{if(!token||Date.now()>expires)throw Error('Autorização expirada. Autorize novamente.');const id=sheetId();$('read').disabled=true;log('Consultando apenas metadados e títulos de colunas...');const meta=await api(encodeURIComponent(id)+'?fields=properties(title),sheets(properties(title,gridProperties(rowCount,columnCount)))');const sheets=meta.sheets.map(x=>x.properties.title);const wanted=['Tarefas','Subtarefas','Projetos','Clientes_Fazendas','Historico','Estudos_Areas','Estudos_Topicos','Estudos_Materiais'];const names=wanted.filter(n=>sheets.includes(n));const ranges=names.map(n=>encodeURIComponent("'"+n.replaceAll("'","''")+"'!A1:AZ1")).join('&ranges=');const headers=names.length?await api(encodeURIComponent(id)+'/values:batchGet?ranges='+ranges+'&valueRenderOption=FORMATTED_VALUE'):{valueRanges:[]};const rows=names.map((n,i)=>({aba:n,linhasConfiguradas:meta.sheets.find(s=>s.properties.title===n).properties.gridProperties.rowCount,colunas:headers.valueRanges[i]?.values?.[0]?.length||0,cabecalhos:headers.valueRanges[i]?.values?.[0]||[]}));log(JSON.stringify({planilha:meta.properties.title,abasEncontradas:sheets,estrutura:rows},null,2));}catch(e){log('Falha na leitura: '+e.message+'\nVerifique se a conta Google autorizada tem acesso à cópia e se a API está ativada.');}finally{$('read').disabled=!token;}};
$('logout').onclick=()=>{if(token&&window.google?.accounts?.oauth2)google.accounts.oauth2.revoke(token,()=>{});token='';expires=0;$('read').disabled=true;$('logout').disabled=true;log('Teste encerrado. Token revogado.');};
</script></body></html>
