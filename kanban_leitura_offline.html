<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atividades Kanban — leitura offline</title><script src="https://accounts.google.com/gsi/client" async defer></script><style>
:root{--a:#072f38;--b:#334e3b;--c:#bd7423}*{box-sizing:border-box}body{margin:0;background:#f2f3ef;color:#173137;font:14px Segoe UI,Arial,sans-serif}header{background:var(--a);color:white;padding:17px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}h1{font-size:20px;margin:0}button{background:var(--b);color:#fff;border:0;border-radius:7px;padding:10px 12px;cursor:pointer;font-weight:600}button:disabled{opacity:.5}button.secondary{background:#e1e8e0;color:var(--a)}main{padding:16px;max-width:1500px;margin:auto}.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bar input,.bar select{padding:10px;border:1px solid #c8d0c7;border-radius:7px;min-width:170px;background:white;color:#173137}.bar input{flex:1}.status{padding:12px;border:1px solid #d6ddd5;border-radius:10px;background:white;margin-bottom:13px}.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:10px;overflow:auto}.lane{background:#e1e8e0;border-radius:10px;padding:10px;min-height:250px}.lane h2{font-size:13px;margin:4px 0 12px}.card{background:white;border:1px solid #d4d9d1;border-radius:9px;padding:12px;margin-bottom:9px}.card strong{color:var(--c);display:block;margin-bottom:6px}.meta{color:#56685d;font-size:12px}.sub{margin:7px 0 0;padding-left:17px;font-size:12px}.sub li{margin:3px 0}.hint{font-size:12px;color:#57675c}.summary{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.pill{background:white;padding:8px 12px;border-radius:9px;border:1px solid #d4d9d1}#error{color:#9a271f;white-space:pre-wrap} @media(max-width:900px){.board{grid-template-columns:repeat(5,250px)}}
</style></head><body><header><h1>Atividades Kanban <small style="font-size:12px;font-weight:normal">— leitura offline</small></h1><span>Somente leitura · Planilha de testes</span></header><main><section class="status"><div id="state">Carregando dados locais...</div><p class="hint">Esta versão lê a cópia de testes e mantém os dados no navegador para consulta offline. Não grava na planilha e não modifica o aplicativo original. Não utilize em dispositivo compartilhado.</p><div class="bar"><button id="auth">Autorizar Google</button><button id="load" disabled>Atualizar dados da cópia</button><button class="secondary" id="clear">Apagar cópia local</button></div><div id="error" role="alert"></div></section><div class="summary" id="summary"></div><div class="bar"><input id="search" placeholder="Buscar título, descrição, fazenda, projeto..." aria-label="Pesquisar"><select id="category"><option value="">Todas as categorias</option><option>Trabalho</option><option>Pessoal</option></select><select id="priority"><option value="">Todas as prioridades</option><option>Crítico</option><option>Médio</option><option>Longo prazo</option><option>Não definida</option></select></div><div class="board" id="board"></div></main><script>
'use strict';
const CLIENT_ID='525741473575-p02i1dsgtsatv07k7lqi6c811upigruh.apps.googleusercontent.com';
const SHEET_ID='1-SovnDqasLhwraN3ThtLotLg8PX6kebN9rLVo3WbSN0';
const SCOPES='https://www.googleapis.com/auth/spreadsheets.readonly';
const $=x=>document.getElementById(x);let token='',tokenClient,expires=0,tasks=[],lastSync='';
const dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open('kanban-leitura-copia-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('cache');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
async function dbAction(mode,method,value){const db=await dbPromise;return new Promise((res,rej)=>{const tx=db.transaction('cache',mode),r=tx.objectStore('cache')[method](...(value||[]));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const dbGet=()=>dbAction('readonly','get',['snapshot']),dbSet=x=>dbAction('readwrite','put',[x,'snapshot']),dbClear=()=>dbAction('readwrite','delete',['snapshot']);
function txt(v){return String(v==null?'':v)}
function escapeHTML(v){return txt(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function status(s){$('state').textContent=s}function err(s){$('error').textContent=s||''}
function rowsToObjects(values){const [headers,...rows]=values||[];if(!headers)return [];return rows.filter(r=>r.some(v=>txt(v).trim())).map(r=>Object.fromEntries(headers.map((h,i)=>[h,txt(r[i])] )))}
async function api(range){const url='https://sheets.googleapis.com/v4/spreadsheets/'+encodeURIComponent(SHEET_ID)+'/values/'+encodeURIComponent(range)+'?valueRenderOption=FORMATTED_VALUE';const r=await fetch(url,{headers:{Authorization:'Bearer '+token},cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error?.message||'HTTP '+r.status);return j.values||[]}
function render(){const q=$('search').value.toLocaleLowerCase('pt-BR').trim(),cat=$('category').value,pr=$('priority').value;const filtered=tasks.filter(t=>(!cat||t.Categoria===cat)&&(!pr||t.Prioridade===pr)&&(!q||[t.Titulo,t.Descricao,t.Fazenda,t.Projeto].some(x=>txt(x).toLocaleLowerCase('pt-BR').includes(q))));$('summary').innerHTML='<span class="pill"><b>'+tasks.length+'</b> atividades carregadas</span><span class="pill"><b>'+filtered.length+'</b> exibidas</span><span class="pill"><b>'+tasks.reduce((a,t)=>a+t.subs.length,0)+'</b> etapas</span>';
const lanes=[['Caixa de entrada',['Caixa de entrada']],['A fazer',['A fazer']],['Fazer agora',['Fazer agora']],['Em andamento',['Em andamento']],['Aguardando',['Aguardando']]];
const done=filtered.filter(t=>['Concluído','Cancelado'].includes(t.Status)).length;const groups=lanes.map(([name,statuses])=>[name,filtered.filter(t=>statuses.includes(t.Status))]);const other=filtered.filter(t=>!lanes.some(x=>x[1].includes(t.Status))&&!['Concluído','Cancelado'].includes(t.Status));if(other.length)groups.push(['Outros',other]);
$('board').innerHTML=groups.map(([name,items])=>'<section class="lane"><h2>'+escapeHTML(name)+' ('+items.length+')</h2>'+items.map(t=>'<article class="card"><strong>'+escapeHTML(t.Titulo)+'</strong><div class="meta">'+escapeHTML([t.Categoria,t.Fazenda,t.Prioridade,t.Urgencia].filter(Boolean).join(' · '))+'</div>'+(t.Prazo?'<div class="meta">Prazo: '+escapeHTML(t.Prazo)+'</div>':'')+(t.subs.length?'<ul class="sub">'+t.subs.map(s=>'<li>'+escapeHTML(s.Status==='Concluído'?'✓ ':'○ ')+escapeHTML(s.Titulo)+'</li>').join('')+'</ul>':'')+'</article>').join('')+'</section>').join('');$('summary').innerHTML+='<span class="pill"><b>'+done+'</b> concluídas/canceladas (ocultas das colunas)</span>'}
async function refresh(){try{err('');if(!token||Date.now()>=expires)throw Error('Autorização expirada. Autorize novamente.');status('Lendo atividades e etapas da cópia...');$('load').disabled=true;const [tv,sv]=await Promise.all([api("'Tarefas'!A1:AM"),api("'Subtarefas'!A1:O")]);const all=rowsToObjects(tv),subs=rowsToObjects(sv),byId=new Map();for(const t of all){t.subs=[];byId.set(t.ID,t)}for(const s of subs){if(s.Arquivada==='Sim')continue;const t=byId.get(s.Task_ID);if(t)t.subs.push(s)}tasks=all.filter(t=>t.Arquivado!=='Sim'&&t.Modelo!=='Sim');lastSync=new Date().toLocaleString('pt-BR');await dbSet({tasks,lastSync});status('Dados atualizados: '+lastSync+'. Disponíveis para consulta offline neste dispositivo.');render()}catch(e){err('Falha na leitura: '+e.message);status('Os dados locais anteriores foram preservados.')}finally{$('load').disabled=!token}}
$('auth').onclick=()=>{try{err('');if(!window.google?.accounts?.oauth2)throw Error('Biblioteca do Google não carregou. Verifique a conexão.');if(!tokenClient)tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:r=>{if(r.error){err(r.error);return}token=r.access_token;expires=Date.now()+(Number(r.expires_in||3600)-60)*1000;$('load').disabled=false;status('Autorizado. Clique em Atualizar dados da cópia.')}});tokenClient.requestAccessToken({prompt:token?'':'consent'})}catch(e){err(e.message)}};
$('load').onclick=refresh;$('search').oninput=render;$('category').onchange=render;$('priority').onchange=render;
$('clear').onclick=async()=>{if(!confirm('Apagar os dados de atividades armazenados neste navegador? Isso não altera o Google Sheets.'))return;await dbClear();tasks=[];lastSync='';render();status('Cópia local apagada.');err('')};
(async()=>{try{const s=await dbGet();if(s){tasks=s.tasks||[];lastSync=s.lastSync||'';status('Cópia local carregada ('+lastSync+'). '+(navigator.onLine?'Conexão disponível.':'Sem internet.')+' Autorize para atualizar.')}else status('Nenhum dado local ainda. Conecte-se e autorize para carregar a cópia.');render()}catch(e){err('Armazenamento local indisponível: '+e.message)}})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
